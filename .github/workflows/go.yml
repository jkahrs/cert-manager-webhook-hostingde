---
  name: Build Go

  on: [ pull_request, push ]

  jobs:
    build-go:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: Setup Go
          uses: actions/setup-go@v7
          with:
            go-version-file: go.mod
        - name: Install dependencies
          run: go mod download
        - name: Build
          run: go build .
